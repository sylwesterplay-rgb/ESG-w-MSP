name: ESG360 TikTok Autopilot
on:
  schedule:
    - cron: '20 10 * * *'
  workflow_dispatch:
    inputs:
      live_publish:
        description: 'Publish to Cloudinary and Buffer? Leave unchecked for render-only test.'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: esg360-tiktok-scheduler
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies in GitHub cloud
        run: python -m pip install -r automation/tiktok/requirements.txt
      - name: Verify Python syntax
        run: python -m py_compile automation/tiktok/render.py automation/tiktok/publish.py automation/tiktok/infographic.py
      - name: Render-only manual test
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.live_publish }}
        env:
          EPISODE_ID: vsme-3-kroki
        run: |
          python automation/tiktok/render.py
          ffprobe -v error -show_streams automation/tiktok/generated/vsme-3-kroki.mp4
      - name: Check new soundtrack before live publication
        if: ${{ github.event_name == 'schedule' || inputs.live_publish }}
        env:
          EPISODE_ID: piecdanych
        run: |
          python automation/tiktok/render.py
          python automation/tiktok/check_media.py automation/tiktok/generated/piecdanych.mp4
      - name: Generate ESG360 infographic for LinkedIn library
        if: ${{ github.event_name == 'schedule' || inputs.live_publish }}
        run: python automation/tiktok/infographic.py
      - name: Save generated infographic for editorial review
        if: ${{ github.event_name == 'schedule' || inputs.live_publish }}
        uses: actions/upload-artifact@v4
        with:
          name: esg360-linkedin-infographic
          path: automation/tiktok/generated/*-linkedin-infographic.png
          retention-days: 14
      - name: Generate upload and schedule by Buffer
        if: ${{ github.event_name == 'schedule' || inputs.live_publish }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: python automation/tiktok/publish.py
