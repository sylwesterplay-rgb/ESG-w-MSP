name: ACC Social Guard — safe offline tests
on:
  push:
    paths:
      - 'automation/tiktok/social_guard.py'
      - 'automation/tiktok/test_social_guard.py'
      - 'automation/tiktok/publish.py'
      - '.github/workflows/acc-social-guard-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile scheduler and guard without running them
        run: python -m py_compile automation/tiktok/publish.py automation/tiktok/social_guard.py automation/tiktok/test_social_guard.py
      - name: Run fail-closed identity and queue tests — no social media credentials
        run: python -m unittest discover -s automation/tiktok -p 'test_social_guard.py' -v
